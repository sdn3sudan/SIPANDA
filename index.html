<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#4A000E">
<title>SIPANDA e-Rapor | SD Negeri 3 Sungai Danau</title>
<link rel="icon" type="image/png" href="">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media=\'all\'">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" media="print" onload="this.media=\'all\'">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#14000a;--red:#E10B2D;--red-d:#8A0019;--red-x:#4A000E;--rose:#FF4D6A;--gold:#FFD27A;--gold-d:#E0A63B;--ink:#FFE9EC;--sub:#F2B8C0;
--line:rgba(255,110,130,.38);--glass:rgba(40,0,10,.55);--ok:#3DDC97;--g:#FFD27A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Rajdhani','Inter','Segoe UI',sans-serif;font-size:16px;font-weight:500;color:var(--ink);min-height:100vh;overflow-x:hidden;background:var(--bg)}
body::before{content:'';position:fixed;inset:0;z-index:-2;background:radial-gradient(ellipse at 15% 0%,#D4102F 0%,transparent 50%),radial-gradient(ellipse at 95% 100%,#A10020 0%,transparent 55%),linear-gradient(160deg,#7A0017 0%,#4A000E 45%,#1E0009 100%)}
body::after{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:56px 56px;}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:rgba(20,0,8,.7)}::-webkit-scrollbar-thumb{background:rgba(255,77,106,.5);border-radius:4px}
#app h1,#app h2,#app h3,#app h4,#app p{margin:0}#app{min-height:100vh}
.orb{position:relative;display:grid;place-items:center;flex-shrink:0}
.orb::before{content:'';position:absolute;inset:-9px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 55%,var(--gold) 80%,transparent 100%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1.5px));animation:spin 6s linear infinite}
.orb::after{content:'';position:absolute;inset:-3px;border-radius:50%;border:1px solid rgba(255,210,122,.25)}
@keyframes spin{to{transform:rotate(360deg)}}
.logo-img{display:block;object-fit:contain;filter:drop-shadow(0 6px 16px rgba(0,0,0,.55))}
.orb-lg .logo-img{width:128px;height:128px}.orb-md .logo-img{width:96px;height:96px}.orb-sm .logo-img{width:40px;height:40px}.orb-sm::before{inset:-4px}.orb-sm::after{display:none}

/* LOGIN */
#login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:34px 18px;position:relative;overflow:hidden}
#login-page::after{content:'';position:absolute;left:-20%;right:-20%;bottom:-8%;height:46%;background-image:linear-gradient(rgba(255,160,175,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(255,160,175,.35) 1px,transparent 1px);background-size:60px 60px;transform:perspective(420px) rotateX(62deg);transform-origin:bottom;-webkit-mask-image:linear-gradient(to top,#000,transparent);mask-image:linear-gradient(to top,#000,transparent);pointer-events:none}
.login-wrap{position:relative;z-index:2;width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;text-align:center}
.brand{font-family:'Orbitron',sans-serif;font-weight:800;font-size:2.7rem;letter-spacing:.32em;margin:30px 0 6px!important;padding-left:.32em;background:linear-gradient(180deg,#fff 20%,var(--gold) 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 18px rgba(255,77,106,.7))}
.sub{font-size:.8rem;letter-spacing:.28em;color:var(--sub);font-weight:600;text-transform:uppercase;margin-bottom:4px}
.school{font-size:.78rem;letter-spacing:.2em;color:var(--gold);margin-top:22px;font-weight:600}
.login-card{width:100%;margin-top:26px;padding:30px 28px 26px;text-align:left;background:linear-gradient(160deg,rgba(60,0,14,.72),rgba(25,0,7,.8));border:1px solid var(--line);border-radius:6px 28px 6px 28px;box-shadow:0 0 0 1px rgba(255,210,122,.08),0 24px 60px rgba(0,0,0,.55),0 0 50px rgba(225,11,45,.28);position:relative}
.login-card::before{content:'';position:absolute;top:0;left:12%;right:12%;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.lc-title{font-family:'Orbitron',sans-serif;font-size:1rem;letter-spacing:.2em;text-transform:uppercase;display:flex;align-items:center;gap:10px;margin-bottom:20px!important}
.lc-title i{color:var(--gold)}
.fg{margin-bottom:15px}.fg label{display:block;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--sub);margin-bottom:6px;font-weight:700}
.iw{position:relative;display:flex;align-items:center}
.iw i.fi{position:absolute;left:15px;color:var(--rose);pointer-events:none}
.iw input,.iw select{width:100%;padding:13px 16px 13px 44px;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:10px;font-family:inherit;font-size:1.02rem;font-weight:500;color:#fff;outline:none;transition:.2s}
.iw input::placeholder{color:rgba(242,184,192,.5)}.iw select option{background:#3a000c;color:#fff}
.iw input:focus,.iw select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,210,122,.14),0 0 18px rgba(255,210,122,.25)}
.toggle-eye{position:absolute;right:15px;color:var(--sub);cursor:pointer}
.btn-login{width:100%;margin-top:8px;padding:14px;border:1px solid rgba(255,210,122,.6);border-radius:10px;background:linear-gradient(135deg,#FF2D4F,#B3001B);color:#fff;font-family:'Orbitron',sans-serif;font-size:.92rem;letter-spacing:.24em;text-transform:uppercase;font-weight:700;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:10px;box-shadow:0 8px 26px rgba(225,11,45,.5),inset 0 1px 0 rgba(255,255,255,.3);transition:.2s}
.btn-login:hover{filter:brightness(1.12);transform:translateY(-1px)}.btn-login:disabled{opacity:.6;cursor:not-allowed}
.forgot{text-align:center;font-size:.82rem;color:var(--sub);margin-top:16px!important;opacity:.85}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:22px}
.chip{display:flex;align-items:center;gap:7px;padding:5px 12px 5px 6px;border:1px solid var(--line);border-radius:30px;background:rgba(20,0,6,.5);font-size:.78rem;font-weight:600;letter-spacing:.04em}
.chip b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold),var(--gold-d));color:#4A000E;font-family:'Orbitron',sans-serif;font-size:.68rem;font-weight:800}

/* HUD / NAV */
#app-layout{min-height:100vh;display:flex;flex-direction:column}
.hud{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:10px 26px;background:linear-gradient(180deg,rgba(40,0,10,.92),rgba(40,0,10,.72));border-bottom:1px solid var(--line)}
.hud::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.7}
.hud-brand{display:flex;align-items:center;gap:14px;min-width:0}
.hud-brand b{font-family:'Orbitron',sans-serif;font-size:1.05rem;letter-spacing:.24em;display:block}
.hud-brand small{font-size:.66rem;letter-spacing:.16em;color:var(--gold);font-weight:700;display:block;white-space:nowrap}
.topnav{display:flex;gap:4px;padding:4px;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:40px;overflow-x:auto;scrollbar-width:none}
.topnav::-webkit-scrollbar{display:none}
.topnav a{display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:30px;color:var(--sub);font-weight:700;font-size:.9rem;letter-spacing:.04em;cursor:pointer;white-space:nowrap;transition:.2s;border:1px solid transparent}
.topnav a:hover{color:#fff;background:rgba(255,255,255,.08)}
.topnav a.active{color:#4A000E;background:linear-gradient(135deg,#FFE4A8,var(--gold-d));box-shadow:0 0 18px rgba(255,210,122,.45)}
.hud-right{position:relative;flex-shrink:0}
.user-pill{display:flex;align-items:center;gap:10px;padding:5px 14px 5px 5px;border:1px solid var(--line);border-radius:40px;background:rgba(0,0,0,.28);cursor:pointer}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#FF2D4F,#8A0019);border:1px solid var(--gold)}
.un{font-weight:700;font-size:.9rem;line-height:1.1;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ur{font-size:.68rem;color:var(--gold);letter-spacing:.08em;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.udm{position:absolute;right:0;top:115%;width:200px;padding:6px 0;background:#3a000c;border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 34px rgba(0,0,0,.6);display:none;z-index:150}.udm.show{display:block}
.udm a{display:flex;gap:10px;align-items:center;padding:10px 16px;color:var(--sub);cursor:pointer;font-weight:600}.udm a:hover{background:rgba(255,77,106,.2);color:#fff}.udm hr{border:0;border-top:1px solid var(--line);margin:5px 0}
.strip{display:flex;gap:10px;flex-wrap:wrap;align-items:center;max-width:1280px;width:100%;margin:0 auto;padding:16px 26px 0}
.tag{display:inline-flex;align-items:center;gap:8px;padding:5px 14px;font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--line);border-radius:4px 14px 4px 14px;background:rgba(0,0,0,.25);color:var(--sub)}
.tag i{color:var(--gold)}
.page{flex:1;width:100%;max-width:1280px;margin:0 auto;padding:18px 26px 34px;animation:rise .35s ease}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.foot{border-top:1px solid var(--line);padding:14px 26px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:.82rem;color:var(--sub);background:rgba(20,0,6,.5);letter-spacing:.06em}
.foot i{color:var(--gold)}

/* DASHBOARD */
.hero{position:relative;display:flex;align-items:center;justify-content:space-between;gap:26px;padding:30px 34px;margin-bottom:22px;border:1px solid var(--line);border-radius:8px 34px 8px 34px;overflow:hidden;background:linear-gradient(120deg,rgba(255,45,79,.32),rgba(40,0,10,.75) 60%)}
.hero::before{content:'';position:absolute;right:-80px;top:-80px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(255,210,122,.28),transparent 65%)}
.hero-l{display:flex;align-items:center;gap:30px;position:relative;z-index:1}
.hero h2{font-family:'Orbitron',sans-serif;font-size:1.55rem;letter-spacing:.06em;line-height:1.25}
.hero p{margin-top:8px!important;color:var(--sub);font-size:1.02rem;max-width:560px;line-height:1.45}
.hero .gt{color:var(--gold)}
.hero-r{position:relative;z-index:1;text-align:right;font-size:.8rem;letter-spacing:.2em;color:var(--gold);font-weight:700;text-transform:uppercase;line-height:1.9}
.hero-r em{font-style:normal;display:block;font-family:'Orbitron',sans-serif;font-size:1.5rem;color:#fff;letter-spacing:.12em}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:22px}
.kpi{position:relative;padding:20px 22px;border:1px solid var(--line);border-radius:6px 22px 6px 22px;background:linear-gradient(160deg,rgba(70,0,16,.6),rgba(25,0,8,.7));overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--gold),transparent)}
.kpi i{position:absolute;right:16px;top:16px;font-size:1.5rem;color:var(--rose);opacity:.55}
.kpi small{display:block;font-size:.74rem;letter-spacing:.2em;text-transform:uppercase;color:var(--sub);font-weight:700}
.kpi b{display:block;margin-top:8px;font-family:'Orbitron',sans-serif;font-size:2.1rem;font-weight:700;color:#fff;text-shadow:0 0 18px rgba(255,77,106,.8)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-bottom:22px}.g2>.card{margin-bottom:0}
.dn{width:136px;height:136px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;background:conic-gradient(var(--gold) calc(var(--p)*1%),rgba(255,255,255,.12) 0);box-shadow:0 0 28px rgba(255,210,122,.25)}
.dn span{width:104px;height:104px;border-radius:50%;display:grid;place-items:center;background:#3a000c;font-family:'Orbitron',sans-serif;font-size:1.35rem;font-weight:700;color:var(--gold)}
.stat-split{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.big-ok{color:var(--ok);font-family:'Orbitron',sans-serif;font-size:1.5rem;font-weight:700;margin-bottom:8px}.big-bad{color:#fff;font-family:'Orbitron',sans-serif;font-size:1.5rem;font-weight:700;text-shadow:0 0 14px rgba(255,77,106,.9)}
.warn-txt{display:block;margin-top:10px;color:var(--gold);font-weight:700}
.ann p{padding:10px 0;border-bottom:1px dashed var(--line);line-height:1.5}.ann p:last-child{border:0}

/* CARD / FORM / TABLE */
.card{background:linear-gradient(160deg,rgba(60,0,14,.62),rgba(25,0,7,.72));border:1px solid var(--line);border-radius:6px 26px 6px 26px;margin-bottom:22px;overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.35)}
.ch{display:flex;align-items:center;gap:12px;padding:15px 24px;font-family:'Orbitron',sans-serif;font-size:.86rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;border-bottom:1px solid var(--line);background:linear-gradient(90deg,rgba(255,45,79,.3),transparent)}
.ch::before{content:'';width:8px;height:8px;transform:rotate(45deg);background:var(--gold);box-shadow:0 0 12px var(--gold)}
.cb{padding:22px 24px;line-height:1.55;color:var(--sub)}
.cb b,.cb h2{color:#fff}.cb small{color:rgba(242,184,192,.8)}.cb p{margin:0 0 10px}
.cb code{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:var(--gold);font-size:.88rem;word-break:break-all}
.btn,.btn2{font-family:inherit;font-size:.92rem;font-weight:700;letter-spacing:.06em;border-radius:10px;padding:10px 18px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:.2s}
.btn{background:linear-gradient(135deg,#FF2D4F,#B3001B);color:#fff;border:1px solid rgba(255,210,122,.55);box-shadow:0 5px 18px rgba(225,11,45,.4)}
.btn2{background:rgba(255,255,255,.07);color:var(--ink);border:1px solid var(--line)}
.btn:hover,.btn2:hover{filter:brightness(1.15);transform:translateY(-1px)}.btn:active,.btn2:active{transform:scale(.97)}.btn:disabled{opacity:.6;cursor:not-allowed}
.btn2[data-del],.btn2.x{color:#FFB3BE;border-color:rgba(255,120,140,.6)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tw{overflow:auto;border:1px solid var(--line);border-radius:12px;-webkit-overflow-scrolling:touch}
.frm{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
input,select,textarea{font-family:inherit}
.frm input,.frm select,.bar select,.bar input,td input,td textarea,td select,textarea{padding:10px 13px;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:10px;color:#fff;font-size:.98rem;font-weight:500;outline:none}
.frm input::placeholder,.bar input::placeholder,td input::placeholder,textarea::placeholder{color:rgba(242,184,192,.5)}
.frm input:focus,.frm select:focus,.bar select:focus,.bar input:focus,td input:focus,td textarea:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 14px rgba(255,210,122,.25)}
select option{background:#3a000c;color:#fff}
input:disabled,textarea:disabled{opacity:.5;cursor:not-allowed}
input[type=checkbox]{accent-color:var(--gold);width:17px;height:17px;padding:0;vertical-align:middle}
td input[type=number]{width:74px;text-align:center}td input,td textarea,td select{width:100%}td input[type=checkbox]{width:17px}
.tw table{border-collapse:collapse;width:100%;min-width:560px;text-align:left;font-size:.95rem}
.tw th{padding:12px 14px;background:rgba(255,45,79,.28);color:var(--gold);font-family:'Orbitron',sans-serif;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;border-bottom:1px solid var(--line)}
.tw td{padding:9px 14px;border-bottom:1px solid rgba(255,110,130,.16);color:var(--ink);vertical-align:middle}
.tw tr:hover td{background:rgba(255,255,255,.05)}.tw td small{color:rgba(242,184,192,.7)}
.p-sb{background:rgba(61,220,151,.22)!important}.p-b{background:rgba(110,170,255,.26)!important}.p-c{background:rgba(255,200,70,.26)!important}.p-k{background:rgba(10,0,3,.55)!important;box-shadow:inset 0 0 0 1px #FF6B81}
td.ro{background:rgba(255,255,255,.04)}
.tpr textarea{flex:1;min-width:200px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#3a000c;border:1px solid var(--ok);border-radius:12px;padding:12px 20px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.6);z-index:600;max-width:92vw;white-space:pre-wrap;text-align:center;color:#fff}
.toast.bad{border-color:var(--gold);box-shadow:0 10px 30px rgba(0,0,0,.6),0 0 20px rgba(255,210,122,.3)}

/* RAPOR PRINT (kertas tetap putih) */
#print{display:none;position:fixed;inset:0;background:#3a000c;overflow:auto;z-index:500}#print.on{display:block}
.pvb{position:sticky;top:0;background:#4A000E;padding:10px;display:flex;gap:8px;z-index:2;border-bottom:2px solid var(--gold)}
.pg{width:210mm;height:296mm;margin:10px auto;background:#fff;padding:14mm 16mm 22mm;position:relative;color:#000;page-break-after:always}
.pg,.pg *{font-family:'Times New Roman',Times,serif!important;font-size:12pt!important;line-height:1.25}
.pg h3{text-align:center;margin:10px 0;font-weight:bold;color:#000}.id{width:100%;margin-bottom:4px;border-collapse:collapse}.id td{border:0;padding:1px 4px;width:auto}
.pg table{border-collapse:collapse;width:100%}.pg th{background:#f2f2f2}
.nl th,.nl td{border:1px solid #000;padding:3px 5px}.nl .grp{font-weight:bold}.j{text-align:justify}.c{text-align:center}
.ft{position:absolute;left:16mm;right:16mm;bottom:10mm;border-top:1px solid #000;display:flex;justify-content:space-between;padding-top:2mm}
.pg .sg td{border:0;text-align:center;vertical-align:top;width:33%}.pg .bx{border:1px solid #000;min-height:14mm;padding:3px;margin:3px 0 8px}

@media(max-width:1000px){
.kpis{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}.hero{flex-direction:column;text-align:center}.hero-l{flex-direction:column;gap:20px}.hero-r{text-align:center}
.hud{padding:10px 14px}.hud-brand small{display:none}.un,.ur{max-width:100px}
.topnav{position:fixed;left:10px;right:10px;bottom:10px;z-index:120;border-radius:20px;background:rgba(40,0,10,.94);box-shadow:0 10px 34px rgba(0,0,0,.65),0 0 0 1px rgba(255,210,122,.15);justify-content:flex-start;padding:6px}
.topnav a{flex-direction:column;gap:3px;padding:7px 12px;font-size:.66rem;border-radius:14px;min-width:62px;justify-content:center}.topnav a i{font-size:1.05rem}
.strip,.page{padding-left:14px;padding-right:14px}.page{padding-bottom:96px}.foot{padding-bottom:96px}}
@media(max-width:600px){.kpis{grid-template-columns:1fr 1fr;gap:12px}.kpi{padding:16px}.kpi b{font-size:1.6rem}.user-info{display:none}.user-pill{padding:5px}input,select,textarea{font-size:16px!important}.cb{padding:16px}.brand{font-size:2.1rem}.hero{padding:24px 18px}.hero h2{font-size:1.2rem}.tag.sem{display:none}}
@media print{*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}html,body{background:#fff!important}body::before,body::after{display:none!important}@page{size:A4;margin:0}body>*:not(#print){display:none!important}#print{position:static;background:none;display:block}.pvb{display:none}.pg{margin:0}}

.logos{display:flex;align-items:center;justify-content:center;gap:14px}
.logos img{height:var(--lh,60px);width:auto;display:block;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5))}
.logos.lg{--lh:104px}.logos.md{--lh:84px}.logos.sm{--lh:58px}
#app-layout{flex-direction:row}
.col{flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh}
.side{width:264px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:18px;padding:22px 16px;background:linear-gradient(180deg,rgba(62,0,15,.92),rgba(25,0,7,.94));border-right:1px solid var(--line);z-index:100}
.side::after{content:'';position:absolute;top:0;bottom:0;right:-1px;width:1px;background:linear-gradient(180deg,transparent,var(--gold),transparent);opacity:.7}
.side-brand{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding-bottom:16px;border-bottom:1px solid var(--line)}
.side-brand b{font-family:'Orbitron',sans-serif;letter-spacing:.26em;font-size:1.05rem;display:block;padding-left:.26em}
.side-brand small{font-size:.62rem;letter-spacing:.14em;color:var(--gold);font-weight:700}
.topnav{position:static;flex-direction:column;gap:6px;padding:0;border:0;background:none;border-radius:0;box-shadow:none;overflow:visible}
.topnav a{flex-direction:row;border-radius:12px;padding:11px 14px;font-size:.95rem;min-width:0;justify-content:flex-start;gap:12px}
.topnav a i{width:20px;text-align:center;font-size:1rem}
.side-badge{margin-top:auto;text-align:center;padding:12px;border:1px solid var(--line);border-radius:6px 18px 6px 18px;background:rgba(0,0,0,.25)}
.side-badge .bs{font-family:'Orbitron',sans-serif;color:var(--gold);letter-spacing:.14em;font-size:.95rem}.side-badge p{font-size:.7rem;margin-top:4px;color:var(--sub);line-height:1.3}
.hud{position:sticky;top:0;justify-content:space-between}
.hud-l{display:flex;gap:10px;flex-wrap:wrap;align-items:center;min-width:0}
.hb{display:none;background:none;border:0;color:#fff;font-size:1.4rem;cursor:pointer;padding:4px 8px}
.bk{display:none}
@media(max-width:1000px){
.side{position:fixed;left:0;top:0;bottom:0;height:auto;transform:translateX(-105%);transition:transform .28s ease}.side.open{transform:none}
.hb{display:block}.bk.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:99}
.page{padding-bottom:34px}.foot{padding-bottom:14px}.tag.clk{display:none}}
@media(max-width:600px){.tag:not(:first-of-type){display:none}.tag{font-size:.68rem;padding:4px 10px}}

.logos img{filter:none}
.sk{height:14px;border-radius:7px;background:linear-gradient(90deg,rgba(255,255,255,.06),rgba(255,255,255,.16),rgba(255,255,255,.06));background-size:200% 100%;animation:shm 1.1s linear infinite;margin:12px 0}
@keyframes shm{to{background-position:-200% 0}}
.swk{background:rgba(0,0,0,.4);color:#fff;border:1px solid var(--gold);border-radius:8px;padding:2px 8px;font-weight:700;font-family:inherit;font-size:.9rem}
.pg .sg{table-layout:fixed}.pg .sg td,.pg .sg td *{font-size:10.5pt!important}.pg .sg td{padding:0 3px;overflow-wrap:break-word}
.hud-l .tag{white-space:nowrap}

const CA={},SWR=['siswa.list','nilai.list','absensi.list','ekskul.list','koku.list','tanggal.get','pengumuman.list','tp.list'];
function api(a,p={}){
  const k=a+'|'+(S&&S.kelas)+'|'+JSON.stringify(p),c=CA[k];
  if(SWR.includes(a)){const f=api0(a,p).then(d=>(CA[k]={d,t:Date.now()},d));if(c){f.catch(()=>{});return Promise.resolve(c.d)}return f}
  if(a==='stats'&&c&&Date.now()-c.t<60000)return Promise.resolve(c.d);
  const r=api0(a,p);
  if(a==='stats')return r.then(d=>(CA[k]={d,t:Date.now()},d));
  if(!/\.list$|^(rapor|leger|me|kelasOptions)$/.test(a))r.then(()=>{Object.keys(CA).forEach(x=>delete CA[x])},()=>{});
  return r}
async function api0(a,p={}){
  const r=await fetch(API_URL,{method:'POST',body:JSON.stringify({action:a,token:S&&S.token,params:p})});
  const j=await r.json();
  if(!j.ok){if(/Sesi/.test(j.error)&&a!=='login'){sessionStorage.clear();S=null;boot()}throw new Error(j.error)}
  return j.data}
function toast(m,bad){const t=document.createElement('div');t.className='toast'+(bad?' bad':'');t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),4000)}
async function run(fn,ok){try{await fn();ok&&toast(ok)}catch(e){toast(e.message,1)}}
const has=c=>S.caps.includes(c),full=()=>has('admin')||has('wali')||has('kepsek'),ro=()=>has('kepsek');
const pred=n=>n===''||n==='-'||n==null?'':n>=76?'p-sb':n>=70?'p-b':n>=50?'p-c':'p-k';
const MENU=[['dashboard','Dashboard','fa-house',1],['sekolah','Data Sekolah','fa-school',full],['siswa','Data Siswa','fa-users',full],['tp','Tujuan Pembelajaran','fa-book-open',1],['nilai','Daftar Nilai','fa-chart-column',1],['absensi','Absensi','fa-calendar-check',full],['ekskul','Ekstrakurikuler','fa-futbol',full],['koku','Kokurikuler','fa-award',full],['leger','Leger','fa-table-list',full],['rapor','Cetak Rapor','fa-print',full],['reset','Reset','fa-arrows-rotate',()=>!ro()],['pengaturan','Pengaturan','fa-gear',1]];

function boot(){S?shell():loginView()}
function loginView(){
  clearInterval(window._clk);
  const ks=[];for(let t=1;t<=6;t++)for(const c of 'ABCD')ks.push(t+c);
  const B=[['B','Berprestasi'],['U','Unggul'],['N','Nasionalisme'],['G','Giat'],['A','Amanah'],['S','Santun']];
  $('#app').innerHTML=`<div id="login-page"><div class="login-wrap">
    ${logo('','orb-lg')}
    <h1 class="brand">SIPANDA</h1><div class="sub">Sistem Informasi Penilaian Akademik Digital</div>
    <div class="login-card"><h3 class="lc-title"><i class="fa-solid fa-fingerprint"></i> Akses E-Rapor</h3>
      <div class="fg"><label>Username (NIP)</label><div class="iw"><i class="fa-solid fa-user fi"></i><input id="u" placeholder="Masukkan NIP" inputmode="numeric" autocomplete="username"></div></div>
      <div class="fg"><label>Password</label><div class="iw"><i class="fa-solid fa-lock fi"></i><input id="p" type="password" placeholder="Password" autocomplete="current-password"><i class="fa-solid fa-eye toggle-eye" id="eye"></i></div></div>
      <div class="fg"><label>Pilih Kelas</label><div class="iw"><i class="fa-solid fa-chalkboard fi"></i><select id="k" disabled><option value="">Isi NIP terlebih dahulu</option></select></div></div>
      <button class="btn-login" id="go"><i class="fa-solid fa-right-to-bracket"></i><span>Masuk</span></button>
      <p class="forgot"><i class="fa-regular fa-circle-question"></i> Lupa password? Hubungi Admin untuk reset.</p></div>
    <div class="chips">${B.map(b=>`<div class="chip"><b>${b[0]}</b>${b[1]}</div>`).join('')}</div>
    <div class="school">SD NEGERI 3 SUNGAI DANAU · KEC. SATUI</div></div></div>`;
  $('#eye').onclick=()=>{const p=$('#p'),e=$('#eye'),show=p.type==='password';p.type=show?'text':'password';e.className='fa-solid toggle-eye '+(show?'fa-eye-slash':'fa-eye')};
  const go=()=>run(async()=>{$('#go').disabled=true;try{S=await api('login',{username:$('#u').value,password:$('#p').value,kelas:$('#k').value});sessionStorage.setItem('sp',JSON.stringify(S));boot()}finally{const b=$('#go');if(b)b.disabled=false}});
  let tm;const lk=async()=>{const u=$('#u').value.trim(),k=$('#k');if(!(/^\d{18}$/.test(u)||u.toLowerCase()==='admin')){k.disabled=true;k.innerHTML='<option value="">Isi NIP terlebih dahulu</option>';return}
    k.innerHTML='<option value="">Memuat kelas…</option>';try{const r=await api('kelasOptions',{username:u});if($('#u').value.trim()!==u)return;
    k.innerHTML=r.kelas.length?(r.kelas.length>1?'<option value="">Pilih kelas</option>':'')+r.kelas.map(x=>`<option value="${x}">Kelas ${x}</option>`).join(''):'<option value="">NIP tidak ditemukan</option>';k.disabled=!r.kelas.length}catch(e){k.innerHTML='<option value="">Pilih kelas</option>'+ks.map(x=>`<option value="${x}">Kelas ${x}</option>`).join('');k.disabled=false;toast(/Aksi tidak dikenal/.test(e.message)?'Kelas otomatis belum aktif: Code.gs belum di-deploy versi baru. Pilih kelas secara manual.':'Gagal memuat kelas otomatis ('+e.message+'). Pilih kelas secara manual.',1)}};
  $('#u').oninput=e=>{e.target.value=e.target.value.replace(/\s/g,'');clearTimeout(tm);tm=setTimeout(lk,300)};$('#go').onclick=go;$('#p').onkeydown=e=>{if(e.key==='Enter')go()}}

function kelSel(){return (S.kelasOpts||[]).length>1?`<select id="swk" class="swk">${S.kelasOpts.map(k=>`<option ${k===S.kelas?'selected':''}>${k}</option>`).join('')}</select>`:esc(S.kelas)}

  $('#app').innerHTML=`<div id="app-layout"><div class="bk" id="bk"></div>

  $('#f').onchange=e=>run(async()=>{
    const f=e.target.files[0];if(!f)return;
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array',raw:true}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''}).map(r=>{const o={};for(const k in r){const n=k.toLowerCase().replace(/[^a-z]/g,'');o[n.startsWith('jenis')||n==='jk'||n==='lp'?'jk':(n==='nomorinduk'||n==='induk')?'nis':n]=r[k]}return o});
    const v=await api('siswa.import',{rows,dryRun:true});
    if(v.errors.length)return toast('Perbaiki dulu:\n'+v.errors.slice(0,8).join('\n'),1);
    if(confirm(`${v.valid} siswa valid. Impor sekarang? (NIS yang sama akan diperbarui)`)){await api('siswa.import',{rows});nav('siswa');toast('Impor berhasil')}})};

V.tp=async el=>{
  const ms=S.mapel.filter(m=>m.lihat);
  el.innerHTML=`<div class="card"><div class="ch">Tujuan Pembelajaran — Semester ${S.config.semester}</div><div class="cb"><div class="bar"><select id="m">${ms.map(m=>`<option value="${m.kode}">${esc(m.nama)}</option>`).join('')}</select><select id="ag" hidden>${S.config.agama.map(a=>`<option>${a}</option>`).join('')}</select></div><p><small>Tulis dengan format “murid dapat …”. Semua TP aktif otomatis menjadi deskripsi capaian di rapor sesuai rentang nilai.${has('pai')||has('inggris')||has('kka')?' TP mapel khusus berlaku per tingkat kelas.':''}</small></p><div id="tl"></div></div></div>`;
  const load=async()=>{
    const m=$('#m').value,edit=ms.find(x=>x.kode===m).edit&&!ro();$('#ag').hidden=m!=='PAB';
    const it=await api('tp.list',{mapel:m,agama:$('#ag').value}),tl=$('#tl');
    const row=(t='',a=true)=>`<div class="bar tpr" style="flex-wrap:nowrap"><textarea rows="2" style="flex:1;padding:6px" ${edit?'':'disabled'}>${esc(t)}</textarea><label><input type="checkbox" ${a?'checked':''} ${edit?'':'disabled'}> aktif</label>${edit?'<button class="btn2 x">✕</button>':''}</div>`;
    tl.innerHTML=it.map(i=>row(i.teks,i.aktif)).join('')+(edit?'<button class="btn2" id="addtp">+ Tambah TP</button> <button class="btn" id="svtp">Simpan TP</button>':'');
    if(!edit)return;
    tl.onclick=e=>{if(e.target.classList.contains('x'))e.target.closest('.tpr').remove()};
    $('#addtp').onclick=()=>$('#addtp').insertAdjacentHTML('beforebegin',row());
    $('#svtp').onclick=()=>run(async()=>{await api('tp.save',{mapel:m,agama:$('#ag').value,items:$$('.tpr',tl).map(r=>({teks:$('textarea',r).value,aktif:$('input',r).checked}))})},'TP tersimpan')};
  $('#m').onchange=$('#ag').onchange=()=>run(load);load()};

V.nilai=async el=>{
  const [sw,nl]=await Promise.all([api('siswa.list'),api('nilai.list')]),ms=S.mapel.filter(m=>m.lihat),D={};
  el.innerHTML=`<div class="card"><div class="ch">Daftar Nilai — Kelas ${S.kelas}, Semester ${S.config.semester}</div><div class="cb"><div class="bar">${ms.some(m=>m.kode==='PAB')?`<select id="fa"><option value="">Semua agama</option>${S.config.agama.map(a=>`<option>${a}</option>`).join('')}</select>`:''}${ro()?'':'<span class="tag" id="sst"><i class="fa-solid fa-cloud-arrow-up"></i><span>Otomatis tersimpan</span></span>'}</div><div class="tw"><table id="tb"></table></div><p><small>Nilai akhir 0–100. Kolom abu-abu hanya dapat dilihat (diinput oleh guru terkait).</small></p></div></div>`;
  const draw=()=>{const fa=$('#fa')?$('#fa').value:'';const rows=sw.filter(s=>!fa||s.agama===fa);
    $('#tb').innerHTML=`<tr><th>No</th><th>Nama</th>${ms.map(m=>`<th>${esc(m.nama)}</th>`).join('')}</tr>`+rows.map((s,i)=>`<tr><td>${i+1}</td><td>${esc(s.nama)}<br><small>${esc(s.nis)} · ${esc(s.agama)}</small></td>${ms.map(m=>{const k=s.nis+'|'+m.kode,v=D[k]!==undefined?D[k]:(nl[k]??'');return `<td class="${pred(v)}${m.edit&&!ro()?'':' ro'}"><input type="number" min="0" max="100" data-k="${esc(k)}" value="${v}" ${m.edit&&!ro()?'':'disabled'}></td>`}).join('')}</tr>`).join('')};
  draw();
  let tmr,busy=false;const st=t=>{const s=$('#sst');if(s)$('span',s).textContent=t};
  const flush=async()=>{if(busy)return;const ks=Object.keys(D);if(!ks.length)return;busy=true;const snap={};ks.forEach(k=>snap[k]=D[k]);st('Menyimpan…');
    try{await api('nilai.save',{entries:ks.map(k=>{const[n,m]=k.split('|');return{nis:n,mapel:m,nilai:snap[k]}})});Object.assign(nl,snap);ks.forEach(k=>{if(D[k]===snap[k])delete D[k]});st('Tersimpan ✓')}
    catch(e){st('Gagal menyimpan, mencoba lagi…');toast(e.message,1);clearTimeout(tmr);tmr=setTimeout(flush,4000)}
    busy=false;if(Object.keys(D).length&&!/Gagal/.test(($('#sst')||{textContent:''}).textContent)){clearTimeout(tmr);tmr=setTimeout(flush,600)}};
  window._flush=flush;
  $('#tb').oninput=e=>{const i=e.target;if(i.dataset.k&&!ro()){D[i.dataset.k]=i.value;i.parentNode.className=pred(i.value===''?'':+i.value);st('Menyimpan…');clearTimeout(tmr);tmr=setTimeout(flush,800)}};
  if($('#fa'))$('#fa').onchange=draw};

V.absensi=async el=>{
  const [sw,a]=await Promise.all([api('siswa.list'),api('absensi.list')]),w=!ro();
  el.innerHTML=`<div class="card"><div class="ch">Data Absensi, Catatan & Kenaikan Kelas — Kelas ${S.kelas}</div><div class="cb">${w?'<button class="btn" id="sv" style="margin-bottom:10px">Simpan</button>':''}<div class="tw"><table><tr><th>No</th><th>Nama</th><th>Sakit</th><th>Izin</th><th>Alpa</th><th>Jumlah</th><th>Catatan Wali Kelas</th><th>Kenaikan Kelas${a.semester==2?'':' (Sem. 2)'}</th></tr>${sw.map((s,i)=>{const x=a.data[s.nis]||{};return `<tr data-n="${esc(s.nis)}"><td>${i+1}</td><td>${esc(s.nama)}</td>${['sakit','izin','alpa'].map(k=>`<td><input type="number" min="0" data-f="${k}" value="${x[k]||0}" ${w?'':'disabled'}></td>`).join('')}<td class="jm">${(x.sakit||0)+(x.izin||0)+(x.alpa||0)}</td><td><textarea data-f="catatan" rows="2" ${w?'':'disabled'}>${esc(x.catatan||'')}</textarea></td><td><input data-f="kenaikan" value="${esc(x.kenaikan||'')}" placeholder="${esc(a.kenaikanDefault)}" ${w?'':'disabled'}></td></tr>`}).join('')}</table></div></div></div>`;
  el.oninput=e=>{const tr=e.target.closest('tr');if(tr&&tr.dataset.n)$('.jm',tr).textContent=$$('input[type=number]',tr).reduce((t,i)=>t+(+i.value||0),0)};
  if(w)$('#sv').onclick=()=>run(()=>api('absensi.save',{entries:$$('tr[data-n]',el).map(tr=>{const o={nis:tr.dataset.n};$$('[data-f]',tr).forEach(i=>o[i.dataset.f]=i.value);return o})}),'Tersimpan')};

V.rapor=async el=>{
  const [sw,tg]=await Promise.all([api('siswa.list'),api('tanggal.get')]);
  el.innerHTML=`<div class="card"><div class="ch">Cetak Rapor — Kelas ${S.kelas}</div><div class="cb"><div class="bar"><input id="tg" placeholder="Tanggal rapor, mis. 26 Juni 2026" value="${esc(tg)}" style="min-width:260px">${ro()?'':'<button class="btn2" id="stg">Simpan Tanggal</button>'}<button class="btn" id="ps">🖨 Cetak yang Dipilih</button><button class="btn" id="pk">🖨 Cetak Satu Kelas</button></div>
  <div class="tw"><table><tr><th><input type="checkbox" id="all"></th><th>No</th><th>Nama</th><th>NIS</th><th>Agama</th><th></th></tr>${sw.map((s,i)=>`<tr><td><input type="checkbox" class="ck" value="${esc(s.nis)}"></td><td>${i+1}</td><td>${esc(s.nama)}</td><td>${esc(s.nis)}</td><td>${esc(s.agama)}</td><td><button class="btn2" data-p="${esc(s.nis)}">Pratinjau</button></td></tr>`).join('')}</table></div></div></div>`;
  $('#all').onchange=e=>$$('.ck').forEach(c=>c.checked=e.target.checked);
  const stg=()=>api('tanggal.save',{tanggal:$('#tg').value});
  if($('#stg'))$('#stg').onclick=()=>run(stg,'Tanggal disimpan');
  const pr=nis=>run(async()=>{if(!ro()&&$('#tg').value!==tg)await stg();const r=await api('rapor',{nis});if(!r.siswa.length)throw new Error('Tidak ada siswa.');
    if(r.peringatan.length&&!confirm('Peringatan nilai belum lengkap:\n'+r.peringatan.map(w=>`• ${w.mapel}: ${w.jumlah} siswa belum diinput oleh ${w.guru}`).join('\n')+'\n\nLanjutkan?'))return;
    const lg=$('#lgs');if(lg)lg.remove();$('#print').innerHTML='<div class="pvb"><button class="btn" onclick="print()">🖨 Cetak / Simpan PDF</button><button class="btn2" onclick="$(\'#print\').classList.remove(\'on\')">Tutup</button></div>'+raporHtml(r);$('#print').classList.add('on')});
  $$('[data-p]').forEach(b=>b.onclick=()=>pr([b.dataset.p]));
  $('#ps').onclick=()=>{const n=$$('.ck:checked').map(c=>c.value);n.length?pr(n):toast('Pilih siswa dahulu.',1)};
  $('#pk').onclick=()=>pr([])};

const fx=s=>{const a=String(s.nis||'').replace(/\D/g,''),b=String(s.nisn||'').replace(/\D/g,'');return a.length===10&&b.length!==10?{...s,nis:s.nisn,nisn:s.nis}:s};
function raporHtml(r){
  const sk=r.sekolah,al=[sk.jalan,sk.rt_rw&&'RT/RW '+sk.rt_rw,sk.desa&&'Desa '+sk.desa,sk.kecamatan&&'Kec. '+sk.kecamatan,sk.kabupaten,sk.provinsi,sk.kode_pos].filter(Boolean).join(', ');
  const idt=s=>`<div style="border-bottom:2px solid #000;padding-bottom:5px;margin-bottom:8px"><table class="id"><tr><td>Nama Murid</td><td>: ${esc(s.nama)}</td><td>Kelas</td><td>: KELAS ${r.kelas}</td></tr><tr><td>NIS/NISN</td><td>: ${esc(s.nis)} / ${esc(s.nisn)}</td><td>Fase</td><td>: ${r.fase}</td></tr><tr><td>Sekolah</td><td>: ${esc(sk.nama)}</td><td>Semester</td><td>: ${r.semester}</td></tr><tr><td>Alamat</td><td>: ${esc(al)}</td><td>Tahun Ajaran</td><td>: ${r.tahun}</td></tr></table></div>`;
  const pg=(s,n,h)=>`<section class="pg">${h}<div class="ft"><span>KELAS ${r.kelas} | ${esc(s.nama)} | ${esc(s.nis)}</span><span>Halaman : ${n}</span></div></section>`;
  const nip=(j,n)=>n?`${j||'NIP'}. ${esc(n)}`:'';
  let out='';
  r.siswa.forEach(s=>{s=fx(s);
    const ch=[];let cur=[],cost=0;
    s.mapel.forEach(m=>{const c=Math.ceil(String(m.deskripsi).length/50)+1;if(cost+c>29&&cur.length){ch.push(cur);cur=[];cost=0}cur.push(m);cost+=c});ch.push(cur);
    ch.forEach((rows,i)=>{let g='',b='';rows.forEach(m=>{if(m.grup!==g){g=m.grup;b+=`<tr><td colspan="4" class="grp">${g==='W'?'Mata Pelajaran Wajib':'Mata Pelajaran Pilihan'}</td></tr>`}b+=`<tr><td class="c">${m.no}</td><td>${esc(m.mapel)}</td><td class="c">${m.nilai}</td><td class="j">${esc(m.deskripsi)}</td></tr>`});
      out+=pg(s,i+1,idt(s)+(i?'':'<h3>LAPORAN HASIL BELAJAR</h3>')+`<table class="nl"><colgroup><col width="6%"><col width="25%"><col width="11%"><col></colgroup><thead><tr><th>No</th><th>Mata Pelajaran</th><th>Nilai Akhir</th><th>Capaian Kompetensi</th></tr></thead><tbody>${b}</tbody></table>`)});
    const ek=[...s.ekskul];while(ek.length<2)ek.push({ekskul:'',keterangan:''});
    out+=pg(s,ch.length+1,idt(s)+`<table class="nl" style="margin-top:6px"><tr><th style="text-align:left">Kokurikuler</th></tr><tr><td class="j">${s.kokurikuler.map(l=>`<div>${esc(l)}</div>`).join('')||'-'}</td></tr></table>
    <table class="nl" style="margin-top:8px"><tr><th width="6%">No</th><th width="40%">Ekstrakurikuler</th><th>Keterangan</th></tr>${ek.map((e,i)=>`<tr><td class="c">${i+1}</td><td>${esc(e.ekskul)}</td><td>${esc(e.keterangan)}</td></tr>`).join('')}</table>
    <table class="nl" style="margin-top:8px;width:55%"><tr><th colspan="2" style="text-align:left">Ketidakhadiran</th></tr><tr><td width="55%">Sakit</td><td>: ${s.sakit} hari</td></tr><tr><td>Izin</td><td>: ${s.izin} hari</td></tr><tr><td>Tanpa Keterangan</td><td>: ${s.alpa} hari</td></tr></table>
    <p style="margin:6px 0 0"><b>Catatan Wali Kelas</b></p><div class="bx">${esc(s.catatan)}</div>${s.kenaikan?`<p style="margin:0 0 4px"><b>Keterangan Kenaikan Kelas :</b> ${esc(s.kenaikan)}</p>`:''}
    <p style="margin:4px 0 0"><b>Tanggapan Orang Tua/Wali Murid</b></p><div class="bx" style="min-height:11mm"></div>
    <p style="text-align:right;margin:0">${esc(sk.tempat_rapor||'')}, ${esc(r.tanggal)||'.....................'}</p>
    <table class="sg"><tr><td>Orang Tua Murid<br><br><br><br>......................................</td><td>Kepala Sekolah<br><br><br><br><u>${esc(r.kepsek.nama)}</u><br>${nip(r.kepsek.jenis,r.kepsek.nip)}</td><td>Wali Kelas<br><br><br><br><u>${esc(r.wali.nama)}</u><br>${nip(r.wali.jenis,r.wali.nip)}</td></tr></table>`)});
  return out}

V.pengaturan=async el=>{
  const i=await api('ss.info'),ad=has('admin'),st=i.status;
  el.innerHTML=`<div class="g2"><div class="card"><div class="ch">Sinkron ke Spreadsheet Saya</div><div class="cb"><p>Tempel link Google Spreadsheet Anda, lalu bagikan sebagai <b>Editor</b> ke:<br><code>${esc(i.emailPemilik)}</code></p><div class="bar"><input id="ss" style="flex:1;min-width:240px" placeholder="https://docs.google.com/spreadsheets/d/…" value="${esc(i.url)}"><button class="btn" id="sss">Simpan</button>${ro()?'':'<button class="btn2" id="ssy">Sinkronkan Sekarang</button>'}</div><small>${st?(st.ok?'✅ ':'❌ ')+esc(st.pesan)+' ('+esc(st.waktu)+')':'Belum pernah sinkron.'}</small></div></div>
  <div class="card"><div class="ch">Ganti Password</div><div class="cb"><div class="frm" style="grid-template-columns:1fr"><input id="pl" type="password" placeholder="Password lama"><input id="pb" type="password" placeholder="Password baru (min. 6)"><input id="pk2" type="password" placeholder="Ulangi password baru"><button class="btn" id="spw">Ganti Password</button></div></div></div></div>${ad?'<div id="adm"></div>':''}`;
  $('#sss').onclick=()=>run(()=>api('ss.set',{url:$('#ss').value}),'Link tersimpan');
  if($('#ssy'))$('#ssy').onclick=()=>run(async()=>{await api('ss.sync');nav('pengaturan')},'Tersinkron');
  $('#spw').onclick=()=>run(async()=>{await api('changePassword',{lama:$('#pl').value,baru:$('#pb').value,konfirmasi:$('#pk2').value});S.passwordDefault=false;sessionStorage.setItem('sp',JSON.stringify(S));$('#pl').value=$('#pb').value=$('#pk2').value=''},'Password diganti');
  if(!ad)return;
  const us=await api('users.list');
  $('#adm').innerHTML=`<div class="card"><div class="ch">Admin — Tahun Pelajaran & Semester</div><div class="cb bar"><input id="th" value="${esc(S.config.tahun)}"><select id="sm"><option value="1" ${S.config.semester==1?'selected':''}>Semester 1 (Ganjil)</option><option value="2" ${S.config.semester==2?'selected':''}>Semester 2 (Genap)</option></select><button class="btn" id="scf">Simpan</button></div></div>
  <div class="card"><div class="ch">Admin — Reset Password Pengguna</div><div class="cb tw"><table><tr><th>Nama</th><th>Username</th><th>Peran</th><th>Kelas Wali</th><th></th></tr>${us.map(u=>`<tr><td>${esc(u.nama)}</td><td>${esc(u.username)}</td><td>${u.roles.join(', ')}</td><td>${u.kelas_wali.join(', ')}</td><td><button class="btn2" data-r="${esc(u.username)}">Reset ke 30303570</button></td></tr>`).join('')}</table></div></div>`;
  $('#scf').onclick=()=>run(async()=>{S.config=await api('config.save',{tahun:$('#th').value,semester:$('#sm').value});sessionStorage.setItem('sp',JSON.stringify(S));shell();nav('pengaturan')},'Disimpan');
  $$('[data-r]').forEach(b=>b.onclick=()=>confirm('Reset password '+b.dataset.r+'?')&&run(async()=>toast(await api('users.resetPassword',{username:b.dataset.r})))) };
boot();
</script></body></html>
